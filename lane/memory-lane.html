<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory lane</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: default; }
  body.live { cursor: none; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; }
  .sans { font-family: -apple-system, "Helvetica Neue", "Segoe UI", Helvetica, Arial, sans-serif; }
  #intro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #f4ece2; text-align: center; transition: opacity 2.2s ease; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 100%); }
  #intro.gone { opacity: 0; pointer-events: none; }
  #name { font-size: clamp(34px, 5.2vw, 76px); font-weight: 400; font-style: italic; letter-spacing: .01em; text-shadow: 0 0 40px rgba(255,220,180,.35); }
  #enter { margin-top: 26px; font-size: 17px; font-weight: 500; opacity: .95; }
  #caption { position: absolute; left: 0; right: 0; bottom: 9vh; text-align: center; color: #f6efe6; opacity: 0;
    transform: translateY(10px); filter: blur(6px); transition: opacity .7s ease, transform .7s ease, filter .7s ease; pointer-events: none; }
  #caption.on { opacity: 1; transform: none; filter: none; transition-duration: 1.8s; }
  #year { font-size: clamp(40px, 6vw, 88px); font-style: italic; line-height: 1; text-shadow: 0 0 34px rgba(255,214,170,.45); }
  #caption { text-shadow: 0 2px 26px rgba(0,0,0,.85); }
  #title { margin-top: 12px; font-size: 18px; font-weight: 500; opacity: .95; }
  #ticks { position: absolute; left: 50%; bottom: 5vh; transform: translateX(-50%); display: flex; gap: 14px; opacity: 0; transition: opacity 2s ease 2s; }
  body.live #ticks { opacity: 1; }
  #ticks i { width: 22px; height: 1px; background: rgba(255,255,255,.22); transition: background .8s ease, box-shadow .8s ease; }
  #ticks i.on { background: #fff; box-shadow: 0 0 10px rgba(255,225,190,.9); }
  #hint, #end { position: absolute; left: 0; right: 0; text-align: center; color: #f4ece2; font-size: 15px; font-weight: 500; opacity: 0; transition: opacity 1.6s ease; pointer-events: none; }
  #hint { top: 5vh; } #hint.on { opacity: .9; }
  #end { bottom: 2.2vh; } #end.on { opacity: .85; transition-delay: 2.5s; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="caption"><div id="year" class="serif"></div><div id="title" class="sans"></div></div>
<div id="ticks"></div>
<div id="hint" class="sans">&rarr; forward &nbsp;&middot;&nbsp; &larr; back &nbsp;&middot;&nbsp; move the mouse to look around</div>
<div id="end" class="sans">End of the lane &nbsp;&middot;&nbsp; &larr; to walk back</div>
<div id="intro"><div id="name" class="serif">Memory lane</div><div id="enter" class="sans">Press &rarr; to step in</div></div>
